services:
  - type: web
    name: ai-erp-operator-api
    runtime: python
    plan: free
    buildCommand: cd apps/api && pip install '.[dev]'
    startCommand: cd apps/api && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://seu-app.vercel.app
      - key: EXTRACTION_INLINE
        value: "true"
      - key: STORAGE_ENABLED
        value: "false"
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-4o-mini
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1